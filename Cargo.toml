[package]
name = "hashstream"
version = "0.1.0"
edition = "2024"
authors = ["David Senk"]
description = "A simple utility to hash stdin and return results on stdout"
readme = "README.md"
repository = "https://github.com/davidsenk/hashstream"
homepage = "https://github.com/davidsenk/hashstream"
license = "Apache-2.0"
keywords = ["hash", "console", "cli", "stream"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = []
nobin = []

[lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = "symbols"
panic = "abort"

[dependencies]
blake2 = "0.10.6"
blake3 = "1.8.2"
clap = { version = "4.5.40", features = ["derive"] }
crc = "3.3.0"
md-5 = "0.10.6"
sha1 = "0.10.6"
sha2 = "0.10.9"
sha3 = "0.10.8"

